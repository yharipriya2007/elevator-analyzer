
<!DOCTYPE html>
<html>
<head>
    <title>Elevator Analyzer</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            padding:20px;
        }
        .container{
            max-width:700px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
        }
        input{
            width:100%;
            padding:10px;
            margin:10px 0;
        }
        button{
            width:100%;
            padding:12px;
            background:#0f5132;
            color:white;
            border:none;
            cursor:pointer;
            font-size:16px;
        }
        .result{
            margin-top:20px;
            padding:15px;
            background:#e9f2ff;
            border-radius:5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Elevator Calculator</h2>

    <label>Mass of Elevator (kg)</label>
    <input type="number" id="mass" placeholder="Enter mass">

    <label>Acceleration (m/s²)</label>
    <input type="number" id="acceleration" placeholder="Enter acceleration">

    <label>Pulley Radius (m)</label>
    <input type="number" id="radius" placeholder="Enter pulley radius">

    <button onclick="calculate()">Calculate Results</button>

    <div class="result" id="result">
        Results will appear here...
    </div>
</div>

<script>
function calculate() {

    let m = parseFloat(document.getElementById("mass").value);
    let a = parseFloat(document.getElementById("acceleration").value);
    let r = parseFloat(document.getElementById("radius").value);

    let g = 9.81;

    let tension = m * (g + a);
    let motorForce = tension;
    let torque = tension * r;

    document.getElementById("result").innerHTML =
        "<b>Cable Tension:</b> " + tension.toFixed(2) + " N<br>" +
        "<b>Motor Force:</b> " + motorForce.toFixed(2) + " N<br>" +
        "<b>Motor Torque:</b> " + torque.toFixed(2) + " N·m";
}
</script>

</body>
</html>
