<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Elevator Analyzer | Analytical Model</title>

<style>
    body{
        margin:0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(120deg,#0f2027,#203a43,#2c5364);
        color:white;
    }

    header{
        text-align:center;
        padding:30px 10px;
        background:#111;
        box-shadow:0 4px 10px rgba(0,0,0,0.5);
    }

    header h1{
        margin:0;
        font-size:32px;
        letter-spacing:1px;
    }

    header p{
        margin:5px;
        font-size:14px;
        opacity:0.8;
    }

    .container{
        max-width:900px;
        margin:40px auto;
        background:white;
        color:#333;
        padding:30px;
        border-radius:12px;
        box-shadow:0 10px 30px rgba(0,0,0,0.3);
    }

    h2{
        text-align:center;
        margin-bottom:20px;
    }

    .input-group{
        margin-bottom:15px;
    }

    label{
        font-weight:bold;
    }

    input{
        width:100%;
        padding:10px;
        margin-top:5px;
        border-radius:6px;
        border:1px solid #ccc;
        font-size:14px;
    }

    button{
        width:100%;
        padding:12px;
        margin-top:20px;
        background:#2c5364;
        color:white;
        border:none;
        border-radius:6px;
        font-size:16px;
        cursor:pointer;
    }

    button:hover{
        background:#203a43;
    }

    .result{
        margin-top:20px;
        padding:15px;
        background:#f1f1f1;
        border-radius:6px;
        font-weight:bold;
    }

    footer{
        text-align:center;
        margin:40px 0 10px 0;
        font-size:13px;
        opacity:0.7;
    }
</style>
</head>

<body>

<header>
    <h1>Elevator Analytical Model</h1>
    <p>Free Body Diagram • Mathematical Model • Numerical Analysis</p>
    <p>Developed by: KLE TECHNOLOGICAL UNIVERSITY</p>
</header>

<div class="container">
    <h2>Elevator Force & Motion Analyzer</h2>

    <div class="input-group">
        <label>Mass of Elevator (kg)</label>
        <input type="number" id="mass" placeholder="Enter mass">
    </div>

    <div class="input-group">
        <label>Acceleration (m/s²)</label>
        <input type="number" id="acc" placeholder="Enter acceleration">
    </div>

    <div class="input-group">
        <label>Gravity (m/s²)</label>
        <input type="number" id="g" value="9.81">
    </div>

    <button onclick="calculate()">Calculate Tension</button>

    <div class="result" id="output"></div>
</div>

<footer>
    © 2026 Elevator Analyzer | Engineering Analytical Project
</footer>

<script>
function calculate(){
    let m = parseFloat(document.getElementById("mass").value);
    let a = parseFloat(document.getElementById("acc").value);
    let g = parseFloat(document.getElementById("g").value);

    let tension = m * (g + a);

    document.getElementById("output").innerHTML =
        "Tension in Cable = " + tension.toFixed(2) + " N";
}
</script>

</body>
</html>
